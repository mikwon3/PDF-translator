<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>PaperKo Web — 논문 PDF 한국어 번역</title>
  <link rel="stylesheet" href="/style.css?v=4" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="logo">A→가</span>
      <div>
        <div class="title">PaperKo <span class="version" id="version"></span></div>
        <div class="subtitle">학술 논문 PDF 한국어 번역 · 웹</div>
      </div>
    </div>
    <div class="brand-actions">
      <button class="ghost" id="aboutBtn">ⓘ 정보</button>
      <button class="ghost" id="settingsBtn">⚙ 설정</button>
    </div>
  </header>

  <main class="wrap">
    <!-- upload -->
    <section id="uploadCard" class="card drop">
      <div class="drop-inner">
        <div class="drop-icon">📄 → 🇰🇷… 아니 가나다</div>
        <p><b>PDF를 여기에 끌어다 놓거나</b> 아래 버튼으로 선택하세요.</p>
        <input type="file" id="fileInput" accept="application/pdf" hidden />
        <button class="primary" id="pickBtn">📂 PDF 선택</button>
        <p class="dim" id="uploadHint">원본 레이아웃(수식·표·그림·2단)을 유지한 채 한국어로 번역합니다.</p>
      </div>
    </section>

    <!-- options + progress -->
    <section id="jobCard" class="card hidden">
      <div class="meta" id="meta"></div>
      <div class="opts">
        <label>페이지 범위 <input id="pages" placeholder="예: 1-3 (비우면 전체)" /></label>
        <label>문체
          <select id="style">
            <option value="formal">격식체(논문투)</option>
            <option value="concise">간결체</option>
          </select>
        </label>
        <label>출력 모드
          <select id="mode">
            <option value="replace">번역 대체본</option>
            <option value="interleaved">대역본(원문+번역 교차)</option>
          </select>
        </label>
      </div>
      <details class="gloss-details" id="glossBox">
        <summary>📓 용어집 <span class="gloss-count" id="glossCount"></span></summary>
        <div class="gloss-body">
          <p class="gloss-hint">한 줄에 <code>영어, 한국어</code> (숫자 셋째칸=우선순위, <code>#</code>=주석)</p>
          <textarea id="glossary" rows="4" placeholder="attention, 어텐션&#10;self-attention, 셀프 어텐션, 10&#10;transformer, 트랜스포머&#10;# 예시 주석"></textarea>
          <label class="chk-inline"><input type="checkbox" id="enforce" /> 용어 강제 적용 (번역문에 지정 역어가 없으면 치환/재번역)</label>
        </div>
      </details>
      <div class="actions">
        <button class="primary" id="translateBtn">▶ 번역 시작</button>
        <button class="ghost" id="resetBtn">새 파일</button>
      </div>
      <div class="progress hidden" id="progress">
        <div class="progress-head"><span id="stageLabel">대기</span><span id="pct">0%</span></div>
        <div class="bar"><div class="bar-fill" id="barFill"></div></div>
        <div class="err hidden" id="err"></div>
        <div class="failed hidden" id="failed"></div>
      </div>
    </section>

    <!-- compare -->
    <section id="viewer" class="card viewer hidden">
      <div class="pager">
        <button id="prevPage">◀</button>
        <span id="pageLabel">1 / ?</span>
        <button id="nextPage">▶</button>
        <span class="dim" id="previewLoading"></span>
        <div class="spacer"></div>
        <div class="zoom">
          <button id="zoomOut">－</button><span id="zoomVal">100%</span><button id="zoomIn">＋</button>
        </div>
        <button class="ghost sm" id="retransPageBtn" disabled>🔄 이 페이지 재번역</button>
        <button class="primary sm" id="downloadBtn" disabled>💾 저장</button>
      </div>
      <div class="compare-scroll" id="scroll">
        <div class="compare" id="compare">
          <figure><figcaption>원문</figcaption><img id="srcImg" alt="source"/></figure>
          <figure><figcaption id="dstCap">번역</figcaption><img id="dstImg" alt="translated"/></figure>
        </div>
      </div>
    </section>
  </main>

  <!-- settings modal -->
  <div class="modal-backdrop hidden" id="settingsModal">
    <div class="modal">
      <h2>설정 (LLM 서버)</h2>
      <label>vLLM 서버 URL
        <div class="inline">
          <input id="sUrl" placeholder="http://203.255.40.88:8567/v1" />
          <button class="ghost sm" id="loadModels">모델 불러오기</button>
        </div>
      </label>
      <label>모델
        <select id="sModel"></select>
      </label>
      <label>API 키 (필요 시) <input id="sKey" type="password" placeholder="비어 있으면 미사용" /></label>
      <div class="dim sm" id="modelHint"></div>
      <div class="modal-actions">
        <button class="ghost" id="closeSettings">닫기</button>
      </div>
    </div>
  </div>

  <!-- about modal -->
  <div class="modal-backdrop hidden" id="aboutModal">
    <div class="modal">
      <div class="about-head">
        <span class="logo">A→가</span>
        <div>
          <h2 id="aboutName">PaperKo</h2>
          <div class="dim sm" id="aboutDesc"></div>
        </div>
      </div>
      <dl class="about-list" id="aboutList"></dl>
      <div class="modal-actions">
        <button class="ghost" id="closeAbout">닫기</button>
      </div>
    </div>
  </div>

  <script src="/app.js?v=4"></script>
</body>
</html>
